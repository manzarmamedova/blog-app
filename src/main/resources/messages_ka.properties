about.what.title=რა არის DevBlog?
about.what.text1=DevBlog არის სივრცე იდეების, გაკვეთილების და გამოცდილების გასაზიარებლად Java, Spring Boot და თანამედროვე ვებ ტექნოლოგიებთან მუშაობისას.
about.what.text2=თითოეული სტატია მიზნად ისახავს რთული თემების გამარტივებას — დაწყებული თუ გამოცდილი დეველოპერისთვის.
