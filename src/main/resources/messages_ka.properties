about.author.title=ავტორის შესახებ
about.author.text=გამარჯობა, მე ვარ მანზარი — დეველოპერი, რომელსაც გატანებული აქვს ბექენდ განვითარება, წმინდა კოდი და სწავლა. ეს ბლოგი არის ადგილი, სადაც ვაფიქსირებ რასაც ვსწავლობ.
